# Декларативные правила для определения клинически значимых гаплотипов.
# Добавление нового правила = добавить запись в `rules` без правки Python.
#
# Типы правил:
#   snp        — один SNP, риск определяется числом копий risk_allele (0/1/2)
#   haplotype  — несколько SNP комбинируются в гаплотип (как APOE)
#
# Каждое правило содержит блок `sources` со ссылками на оригинальные
# публикации и указанием конкретной таблицы/секции, откуда взяты OR.

rules:
  # --- APOE (ε2/ε3/ε4) — болезнь Альцгеймера ---
  - id: apoe
    name: "APOE"
    description: "APOE haplotype (ε2/ε3/ε4) — risk of Alzheimer's disease"
    type: haplotype
    required_snps: [rs429358, rs7412]
    haplotype_rules:
      - alleles: {rs429358: T, rs7412: T}
        name: e2
      - alleles: {rs429358: T, rs7412: C}
        name: e3
      - alleles: {rs429358: C, rs7412: C}
        name: e4
      - alleles: {rs429358: C, rs7412: T}
        name: e1   # очень редкий
    diplotype_risk:
      "e2/e2": {disease: "Болезнь Альцгеймера", level: "Пониженный риск", code: "reduced", or: 0.6, details: "Определён генотип APOE ε2/ε2. В исследованиях он связан с меньшей частотой болезни Альцгеймера по сравнению с ε3/ε3."}
      "e2/e3": {disease: "Болезнь Альцгеймера", level: "Пониженный риск", code: "reduced", or: 0.6, details: "Определён генотип APOE ε2/ε3. В исследованиях он связан с меньшей частотой болезни Альцгеймера по сравнению с ε3/ε3."}
      "e2/e4": {disease: "Болезнь Альцгеймера", level: "Повышенный риск", code: "elevated", or: 2.6, details: "Определён генотип APOE ε2/ε4. В приведённом исследовании болезнь Альцгеймера встречалась чаще, чем при ε3/ε3."}
      "e3/e3": {disease: "Болезнь Альцгеймера", level: "Референсный генотип", code: "reference", or: 1.0, details: "Определён генотип APOE ε3/ε3. Он служит группой сравнения для указанных относительных оценок."}
      "e3/e4": {disease: "Болезнь Альцгеймера", level: "Повышенный риск", code: "elevated", or: 3.2, details: "Определён генотип APOE ε3/ε4. В исследованиях он связан с большей частотой болезни Альцгеймера по сравнению с ε3/ε3."}
      "e4/e4": {disease: "Болезнь Альцгеймера", level: "Высокий риск", code: "high", or: 11.6, details: "Определён генотип APOE ε4/ε4. В исследованиях он связан с существенно большей частотой болезни Альцгеймера по сравнению с ε3/ε3."}
    sources:
      - citation: "Genin E, et al. APOE and Alzheimer disease: a major gene with semi-dominant inheritance. Mol Psychiatry. 2011;16(9):903-907."
        doi: "10.1038/mp.2011.52"
        url: "https://doi.org/10.1038/mp.2011.52"
        pubmed: "21556001"
      - citation: "Reiman EM, et al. Exceptionally low likelihood of Alzheimer's dementia in APOE2 homozygotes from a 5,000-person neuropathological study. Nat Commun. 2020;11(1):667."
        doi: "10.1038/s41467-019-14279-8"
        url: "https://doi.org/10.1038/s41467-019-14279-8"
        pubmed: "32015339"

  # --- Factor V Leiden — венозная тромбоэмболия ---
  - id: factor_v_leiden
    name: "F5 (Factor V Leiden)"
    description: "rs6025 — Arg506Gln, резистентность к активированному протеину C"
    type: snp
    snp: rs6025
    risk_allele: T
    genotypes:
      "0/0":
        disease: "Тромбофилия (венозные тромбозы)"
        level: "Вариант не обнаружен"
        code: "not_detected"
        details: "Вариант F5 Leiden не обнаружен. Другие причины венозного тромбоза этот результат не исключает."
      "0/1":
        disease: "Тромбофилия (венозные тромбозы)"
        level: "Умеренно повышенный риск"
        code: "moderately_elevated"
        or: 6
        details: "Обнаружена одна копия варианта F5 Leiden. У носителей венозный тромбоз встречается чаще, чем у людей без этого варианта; индивидуальный риск зависит и от других факторов."
      "1/1":
        disease: "Тромбофилия (венозные тромбозы)"
        level: "Высокий риск"
        code: "high"
        or: 60
        details: "Обнаружены две копии варианта F5 Leiden. Предрасположенность к венозному тромбозу выше, чем при одной копии; результат требует клинической оценки."
    sources:
      - citation: "Ridker PM, et al. Mutation in the gene coding for coagulation factor V and the risk of myocardial infarction, stroke, and venous thrombosis in apparently healthy men. N Engl J Med. 1995;332(14):912-917."
        doi: "10.1056/NEJM199504063321403"
        url: "https://doi.org/10.1056/NEJM199504063321403"
        pubmed: "7877648"
      - citation: "Rosendaal FR, et al. High risk of thrombosis in patients homozygous for factor V Leiden (activated protein C resistance). Blood. 1995;85(6):1504-1508."
        pubmed: "7888671"
        url: "https://ashpublications.org/blood/article/85/6/1504/180062/"
      - citation: "Segal JB, et al. Predictive value of factor V Leiden and prothrombin G20210A in adults with venous thromboembolism and in family members of those with a mutation: a systematic review. JAMA. 2009;301(23):2472-2485."
        doi: "10.1001/jama.2009.853"
        url: "https://doi.org/10.1001/jama.2009.853"
        pubmed: "19531787"

  # --- Prothrombin G20210A — венозная тромбоэмболия ---
  - id: prothrombin_g20210a
    name: "F2 (Prothrombin G20210A)"
    description: "rs1799963 — повышение уровня протромбина, риск ВТЭ"
    type: snp
    snp: rs1799963
    risk_allele: A
    genotypes:
      "0/0":
        disease: "Тромбофилия (венозные тромбозы)"
        level: "Вариант не обнаружен"
        code: "not_detected"
        details: "Вариант F2 G20210A не обнаружен. Другие причины венозного тромбоза этот результат не исключает."
      "0/1":
        disease: "Тромбофилия (венозные тромбозы)"
        level: "Умеренно повышенный риск"
        code: "moderately_elevated"
        or: 3
        details: "Обнаружена одна копия варианта F2 G20210A. У носителей венозный тромбоз встречается чаще, чем у людей без этого варианта; индивидуальный риск зависит и от других факторов."
      "1/1":
        disease: "Тромбофилия (венозные тромбозы)"
        level: "Высокий риск"
        code: "high"
        or: 10
        details: "Обнаружены две копии варианта F2 G20210A. Такой генотип связан с повышенной предрасположенностью к венозному тромбозу; результат требует клинической оценки."
    sources:
      - citation: "Poort SR, et al. A common genetic variation in the 3'-untranslated region of the prothrombin gene is associated with elevated plasma prothrombin levels and an increase in venous thrombosis. Blood. 1996;88(10):3698-3703."
        pubmed: "8916933"
        url: "https://ashpublications.org/blood/article/88/10/3698/137751/"
      - citation: "Segal JB, et al. Predictive value of factor V Leiden and prothrombin G20210A. JAMA. 2009;301(23):2472-2485."
        doi: "10.1001/jama.2009.853"
        url: "https://doi.org/10.1001/jama.2009.853"
        pubmed: "19531787"

  # --- HFE C282Y — наследственный гемохроматоз тип 1 ---
  - id: hfe_c282y
    name: "HFE C282Y"
    description: "rs1800562 — основная мутация при гемохроматозе"
    type: snp
    snp: rs1800562
    risk_allele: A
    genotypes:
      "0/0":
        disease: "Наследственный гемохроматоз"
        level: "Вариант не обнаружен"
        code: "not_detected"
        details: "Вариант HFE C282Y не обнаружен. При повышенных показателях обмена железа их причину нужно оценивать отдельно."
      "0/1":
        disease: "Наследственный гемохроматоз"
        level: "Одна копия C282Y"
        code: "carrier"
        details: "Обнаружена одна копия HFE C282Y. Такой генотип сам по себе обычно не приводит к клинически значимой перегрузке железом; его оценивают вместе с H63D и показателями обмена железа."
      "1/1":
        disease: "Наследственный гемохроматоз"
        level: "Высокий риск перегрузки железом"
        code: "high"
        details: "Обнаружены две копии HFE C282Y. Этот генотип связан с HFE-гемохроматозом, но перегрузка железом развивается не у всех носителей; необходима оценка насыщения трансферрина и ферритина."
    sources:
      - citation: "Feder JN, et al. A novel MHC class I-like gene is mutated in patients with hereditary haemochromatosis. Nat Genet. 1996;13(4):399-408."
        doi: "10.1038/ng0896-399"
        url: "https://doi.org/10.1038/ng0896-399"
        pubmed: "8696333"
      - citation: "European Association for the Study of the Liver. EASL Clinical Practice Guidelines on haemochromatosis. J Hepatol. 2022;77(2):479-502."
        doi: "10.1016/j.jhep.2022.03.033"
        url: "https://doi.org/10.1016/j.jhep.2022.03.033"
        pubmed: "35662478"
      - citation: "Pilling LC, et al. Common conditions associated with hereditary haemochromatosis genetic variants: cohort study in UK Biobank. BMJ. 2019;364:k5222."
        doi: "10.1136/bmj.k5222"
        url: "https://doi.org/10.1136/bmj.k5222"
        pubmed: "30651232"

  # --- HFE H63D — мягкая форма / модификатор ---
  - id: hfe_h63d
    name: "HFE H63D"
    description: "rs1799945 — вариант HFE H63D"
    type: snp
    snp: rs1799945
    risk_allele: G
    genotypes:
      "0/0":
        disease: "Обмен железа"
        level: "Вариант не обнаружен"
        code: "not_detected"
        details: "Вариант HFE H63D не обнаружен. При повышенных показателях обмена железа их причину нужно оценивать отдельно."
      "0/1":
        disease: "Обмен железа"
        level: "Одна копия H63D"
        code: "marker"
        details: "Обнаружена одна копия HFE H63D. Сам по себе такой генотип редко приводит к клинически значимой перегрузке железом; значение зависит от C282Y и показателей обмена железа."
      "1/1":
        disease: "Обмен железа"
        level: "Две копии H63D"
        code: "marker"
        details: "Обнаружены две копии HFE H63D. Этот генотип не подтверждает перегрузку железом; при изменённых анализах необходима оценка других причин."
    sources:
      - citation: "Mura C, Raguenes O, Férec C. HFE mutations analysis in 711 hemochromatosis probands: evidence for S65C implication in mild form of hemochromatosis. Blood. 1999;93(8):2502-2505."
        pubmed: "10194430"
        url: "https://ashpublications.org/blood/article/93/8/2502/250793/"
      - citation: "EASL Clinical Practice Guidelines on haemochromatosis. J Hepatol. 2022;77(2):479-502."
        doi: "10.1016/j.jhep.2022.03.033"
        url: "https://doi.org/10.1016/j.jhep.2022.03.033"
        pubmed: "35662478"

  # --- PCSK9 R46L — защитный вариант, низкий ЛПНП ---
  - id: pcsk9_lof
    name: "PCSK9 (R46L)"
    description: "rs11591147 — loss-of-function PCSK9, защита от ИБС"
    type: snp
    snp: rs11591147
    risk_allele: T
    genotypes:
      "0/0":
        disease: "Уровень ЛПНП и риск ИБС"
        level: "Защитный вариант не обнаружен"
        code: "not_detected"
        details: "Вариант PCSK9 R46L не обнаружен. Уровень холестерина и риск ишемической болезни сердца по этому результату не определяются."
      "0/1":
        disease: "Уровень ЛПНП (защита от ИБС)"
        level: "Связан со снижением риска ИБС"
        code: "reduced"
        details: "Обнаружена одна копия PCSK9 R46L. В исследованиях этот вариант связан с более низким уровнем холестерина ЛПНП и меньшей частотой ишемической болезни сердца."
      "1/1":
        disease: "Уровень ЛПНП (защита от ИБС)"
        level: "Связан со снижением риска ИБС"
        code: "reduced"
        details: "Обнаружены две копии PCSK9 R46L. Вариант связан с более низким уровнем холестерина ЛПНП; фактический уровень следует оценивать по липидограмме."
    sources:
      - citation: "Cohen JC, Boerwinkle E, Mosley TH Jr, Hobbs HH. Sequence variations in PCSK9, low LDL, and protection against coronary heart disease. N Engl J Med. 2006;354(12):1264-1272."
        doi: "10.1056/NEJMoa054013"
        url: "https://doi.org/10.1056/NEJMoa054013"
        pubmed: "16554528"
      - citation: "Kathiresan S, et al. A PCSK9 missense variant associated with a reduced risk of early-onset myocardial infarction. N Engl J Med. 2008;358(21):2299-2300."
        doi: "10.1056/NEJMc0707445"
        url: "https://doi.org/10.1056/NEJMc0707445"
        pubmed: "18499582"

  # --- HLA-B*57:01 (через tag SNP) — гиперчувствительность к абакавиру ---
  - id: hla_b5701
    name: "HCP5 (маркер HLA-B*57:01)"
    description: "rs2395029 — косвенный маркер HLA-B*57:01"
    type: snp
    snp: rs2395029
    risk_allele: G
    genotypes:
      "0/0":
        disease: "Гиперчувствительность к абакавиру"
        level: "Косвенный маркер не обнаружен"
        code: "undetermined"
        details: "Косвенный маркер rs2395029 не обнаружен. Сам аллель HLA-B*57:01 этим анализом не определён."
      "0/1":
        disease: "Гиперчувствительность к абакавиру"
        level: "Косвенный маркер обнаружен"
        code: "proxy_marker"
        details: "Обнаружена одна копия rs2395029 — косвенного маркера HLA-B*57:01. Перед назначением абакавира нужен результат теста на HLA-B*57:01."
      "1/1":
        disease: "Гиперчувствительность к абакавиру"
        level: "Косвенный маркер обнаружен"
        code: "proxy_marker"
        details: "Обнаружены две копии rs2395029 — косвенного маркера HLA-B*57:01. Перед назначением абакавира нужен результат теста на HLA-B*57:01."
    sources:
      - citation: "Mallal S, et al. HLA-B*5701 screening for hypersensitivity to abacavir. N Engl J Med. 2008;358(6):568-579."
        doi: "10.1056/NEJMoa0706135"
        url: "https://doi.org/10.1056/NEJMoa0706135"
        pubmed: "18256392"
      - citation: "Martin MA, et al. Clinical Pharmacogenetics Implementation Consortium guidelines for HLA-B genotype and abacavir dosing: 2014 update. Clin Pharmacol Ther. 2014;95(5):499-500."
        doi: "10.1038/clpt.2014.38"
        url: "https://doi.org/10.1038/clpt.2014.38"
        pubmed: "24561393"
      - citation: "PharmGKB / CPIC current guideline (online, periodically updated)."
        url: "https://cpicpgx.org/guidelines/guideline-for-abacavir-and-hla-b/"
