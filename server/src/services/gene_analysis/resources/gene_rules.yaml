# Правила раздела «Оценки по правилам». Координаты вариантов: GRCh37.
# Порядок записей определяет порядок карточек; тексты и условия показа заданы здесь.
reviewed: '2026-11-17'
findings:
    - id: dhcr7_slos
      gene: DHCR7
      condition: Синдром Смита — Лемли — Опитца
      match:
          type: clinvar
          rsid: rs11555217
          chrom: '11'
          pos: 71152447
          ref: C
          alt: T
          clinvar_id: RCV000020436
          category: candidate
      cases:
          - when: { alt_copies: 1 }
            role: Обнаружена одна копия варианта DHCR7, связанного с синдромом Смита — Лемли — Опитца; возможно носительство.
            interpretation: >-
                Обнаружена одна копия варианта DHCR7, связанного с синдромом Смита — Лемли — Опитца.
                Заболевание обычно развивается при изменениях в обеих копиях гена. Этот результат
                может иметь значение при планировании семьи, но не подтверждает заболевание у пациента.
            recommendation: >-
                Подтвердить вариант в клинической лаборатории, если результат будет использоваться
                для медицинских решений. При планировании беременности обсудить с врачом-генетиком
                обследование партнёра и необходимость уточнения других вариантов DHCR7.
          - when: { alt_copies: 2 }
            role: Обнаружены две копии варианта DHCR7, связанного с синдромом Смита — Лемли — Опитца; требуется клиническое подтверждение.
            interpretation: >-
                Обнаружены две копии варианта DHCR7, связанного с синдромом Смита — Лемли — Опитца.
                Такой генотип требует сопоставления с состоянием пациента и лабораторными данными;
                по результату исходного VCF диагноз не устанавливается.
            recommendation: >-
                Направить пациента к врачу-генетику для подтверждения варианта клиническим методом.
                При наличии характерных признаков оценить уровень 7-дегидрохолестерина и провести
                обследование по назначению специалиста.
      sources:
          - https://www.ncbi.nlm.nih.gov/clinvar/RCV000020436/
          - https://www.ncbi.nlm.nih.gov/books/NBK1143/

    - id: chek2_i157t
      gene: CHEK2
      condition: Вариант CHEK2 и риск некоторых опухолей
      match:
          type: clinvar
          rsid: rs17879961
          chrom: '22'
          pos: 29121087
          ref: A
          alt: G
          clinvar_id: RCV004556709
          category: candidate
      cases:
          - when: { alt_copies: 1 }
            role: Обнаружена одна копия CHEK2 p.Ile157Thr, связанного с небольшим повышением риска некоторых опухолей.
            interpretation: >-
                Обнаружена одна копия варианта CHEK2 p.Ile157Thr. В исследованиях он связан
                с небольшим повышением вероятности некоторых опухолей, прежде всего рака молочной
                железы. Сам по себе этот вариант не означает, что опухоль есть или обязательно
                возникнет, и обычно не служит основанием для усиленного обследования.
            recommendation: >-
                Уточнить личный и семейный онкологический анамнез: виды опухолей, возраст их выявления
                и степень родства заболевших. При отягощённом анамнезе обсудить консультацию
                врача-генетика и необходимость подтверждающего анализа. План профилактических
                обследований определять по возрасту и совокупному риску, а не по одному варианту CHEK2.
          - when: { alt_copies: 2 }
            role: Обнаружены две копии CHEK2 p.Ile157Thr; индивидуальный риск опухолей по этому генотипу надёжно не определён.
            interpretation: >-
                Обнаружены две копии CHEK2 p.Ile157Thr. Данных для надёжной оценки индивидуального
                риска при таком генотипе недостаточно. По одному результату нельзя определить,
                возникнет ли опухоль или требуется ли обследование сверх обычной программы.
            recommendation: >-
                Подтвердить генотип клиническим анализом и собрать личный и семейный онкологический
                анамнез. Перед изменением программы наблюдения направить пациента к специалисту
                по наследственным опухолям для оценки общего риска.
      sources:
          - https://www.ncbi.nlm.nih.gov/clinvar/variation/5591/
          - https://pmc.ncbi.nlm.nih.gov/articles/PMC10623578/

    - id: ugt1a1_60
      gene: UGT1A1
      condition: Особенности обмена билирубина
      match:
          type: clinvar
          rsid: rs4124874
          chrom: '2'
          pos: 234665659
          ref: T
          alt: G
          clinvar_id: RCV000999557
          category: candidate
      cases:
          - when: { alt_copies: 1 }
            role: Обнаружена одна копия UGT1A1*60, связанного с особенностями обмена билирубина; значение зависит от других вариантов гена.
            interpretation: >-
                Обнаружена одна копия UGT1A1*60. Этот вариант может встречаться вместе с другими
                изменениями UGT1A1, влияющими на обмен билирубина. По нему одному нельзя установить
                синдром Жильбера или объяснить повышение билирубина.
            recommendation: >-
                При повышенном билирубине оценить его прямую и непрямую фракции и исключить другие
                причины изменений. Если после обследования остаётся подозрение на синдром Жильбера,
                обсудить анализ UGT1A1*28 и других вариантов гена по показаниям.
          - when: { alt_copies: 2 }
            role: Обнаружены две копии UGT1A1*60, связанного с особенностями обмена билирубина; синдром Жильбера по этому результату не подтверждён.
            interpretation: >-
                Обнаружены две копии UGT1A1*60. Такой генотип встречается у людей с особенностями
                обмена билирубина, но сам по себе не подтверждает синдром Жильбера. Вариант может
                сочетаться с UGT1A1*28, который этот анализ не определяет.
            recommendation: >-
                Сопоставить результат с общим билирубином и его фракциями. Если повышена главным
                образом непрямая фракция, исключить другие причины, включая заболевания печени
                и повышенное разрушение эритроцитов. При необходимости уточнить число TA-повторов
                в промоторе UGT1A1 для проверки варианта *28.
      sources:
          - https://www.ncbi.nlm.nih.gov/clinvar/RCV000999557/
          - https://pmc.ncbi.nlm.nih.gov/articles/PMC6699345/

    - id: hfe_combined
      gene: HFE
      condition: Варианты HFE и обмен железа
      match:
          type: genotype_rules
          rule_ids: [hfe_h63d, hfe_c282y]
      cases:
          - when: { hfe_c282y: high }
            role: Обнаружены две копии HFE C282Y, связанные с наследственным гемохроматозом; наличие перегрузки железом необходимо проверить по анализам.
            interpretation: >-
                Обнаружены две копии HFE C282Y — генотип, тесно связанный с наследственным
                гемохроматозом. Не у каждого человека с таким генотипом развивается перегрузка
                железом; её наличие и выраженность определяют по анализам и состоянию пациента.
            recommendation: >-
                Подтвердить генотип клиническим анализом, определить насыщение трансферрина железом
                и ферритин. С результатами обратиться к профильному специалисту для оценки
                необходимости наблюдения или лечения.
          - when: { hfe_c282y: carrier, hfe_h63d: marker }
            role: Обнаружены варианты HFE C282Y и H63D, которые в сочетании могут влиять на показатели обмена железа.
            interpretation: >-
                Обнаружены варианты C282Y и H63D. Такое сочетание может быть связано
                с изменениями показателей обмена железа, но само по себе не подтверждает
                перегрузку железом. Значение результата зависит от анализов и других причин
                повышения ферритина.
            recommendation: >-
                Оценить насыщение трансферрина железом и ферритин с учётом жалоб и анамнеза.
                При стойких отклонениях подтвердить генотип и направить пациента к профильному
                специалисту; при нормальных показателях лечение по генотипу не требуется.
          - when: { hfe_c282y: carrier }
            role: Обнаружена одна копия HFE C282Y; такой генотип обычно означает носительство и сам по себе не подтверждает гемохроматоз.
            interpretation: >-
                Обнаружена одна копия HFE C282Y без выявленного H63D. Такой результат обычно
                означает носительство варианта и сам по себе не устанавливает гемохроматоз.
                Повышение ферритина или насыщения трансферрина требует отдельной оценки.
            recommendation: >-
                Если есть жалобы, семейная история гемохроматоза или отклонения в анализах,
                проверить насыщение трансферрина железом и ферритин. Дальнейшее обследование
                определять по этим данным, а не по одному генотипу.
          - when: { hfe_h63d: marker }
            role: Обнаружен вариант HFE H63D, который может влиять на показатели обмена железа; сам по себе он редко вызывает значимую перегрузку железом.
            interpretation: >-
                Обнаружен HFE H63D, при этом C282Y не выявлен. Изолированный H63D редко
                приводит к значимой перегрузке железом и не подтверждает гемохроматоз.
                Если показатели обмена железа повышены, нужно искать и другие причины.
            recommendation: >-
                Сопоставить результат с имеющимися анализами. При жалобах или подозрении
                на перегрузку железом определить насыщение трансферрина железом и ферритин;
                при отклонениях оценить заболевания печени, воспаление и другие возможные причины.
      sources:
          - https://easl.eu/wp-content/uploads/2022/06/PIIS01688278220021121.pdf

    - id: hla_proxy
      gene: HLA-B
      condition: 'Абакавир: проверка HLA-B*57:01'
      match:
          type: genotype_rules
          rule_ids: [hla_b5701]
      cases:
          - when: { hla_b5701: proxy_marker }
            role: Обнаружен rs2395029 — косвенный маркер HLA-B*57:01, связанного с риском реакции на абакавир; требуется прямое типирование.
            interpretation: >-
                Обнаружен rs2395029 — вариант, который часто наследуется вместе с HLA-B*57:01.
                Сам аллель HLA-B*57:01 здесь не определялся. Поэтому этот результат нельзя
                использовать как подтверждение или исключение риска реакции на абакавир.
            recommendation: >-
                Если рассматривается назначение абакавира, до начала лечения провести прямое
                типирование HLA-B*57:01. Решение о препарате принимать по результату этого теста,
                а не по косвенному маркеру rs2395029.
      sources:
          - https://cpicpgx.org/wp-content/uploads/2016/01/CPIC_HLAB-Abacavir.pdf
